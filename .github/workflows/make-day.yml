# Make the day's Shorts: one job per topic folder, all in parallel, on GitHub's free Linux minutes.
# Trigger: push daily/<date>/make.txt (one studio/public folder name per line) on a claude/ branch, or run it from the Actions tab.
# Each topic: headline screenshots -> auto-review -> Gemini voice (Orus) -> Whisper timing + number check -> render.
# Output: Actions artifact + branch render-<folder> holding the mp4, so Claude can fetch and check it.
# Secrets (Settings > Secrets and variables > Actions): GEMINI_API_KEY (or GOOGLE_API_KEY), GROQ_API_KEY.
name: Make the day's Shorts

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["daily/*/make.txt"]
  workflow_dispatch:
    inputs:
      names:
        description: "Topic folders under studio/public, comma separated"
        required: true

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.l.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: l
        env:
          INPUT: ${{ inputs.names }}
        run: |
          if [ -n "$INPUT" ]; then
            names=$(echo "$INPUT" | tr ',' '\n')
          else
            f=$(git diff --name-only HEAD~1 HEAD | grep -E '^daily/[^/]+/make.txt$' | tail -1)
            names=$(grep -v '^\s*#' "$f" | sed 's/\s//g' | grep -v '^$')
          fi
          echo "names=$(echo "$names" | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"

  make:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2 # the free Gemini TTS tier limits requests per minute
      matrix:
        name: ${{ fromJson(needs.list.outputs.names) }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache Whisper models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Cache Remotion
        id: nodecache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: studio/node_modules
          key: node-${{ hashFiles('studio/package-lock.json') }}

      - name: Check keys
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret is missing on this repo"; exit 1; fi

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r pipeline/requirements.txt "pillow==11.0.0" "playwright==1.49.1"

      - name: Headline screenshots for this topic
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, os, re
          d = f"studio/public/{os.environ['NAME']}"
          used = set(re.findall(r'broll/([\w-]+)\.jpg', open(f"{d}/scenes.json").read()))
          allshots = json.load(open("studio/public/broll/shots.json"))
          json.dump({k: v for k, v in allshots.items() if k in used}, open("studio/public/broll/shots.json", "w"))
          print("shots:", sorted(used))
          EOF
          python -m playwright install --with-deps chromium > /dev/null
          python pipeline/broll.py shots

      - name: Auto-review (Gemini + Groq)
        continue-on-error: true
        run: python pipeline/review.py "$NAME"

      - name: Reuse the last voice if the spoken text did not change
        id: reuse
        run: |
          git fetch -q --depth 1 origin "render-$NAME" 2>/dev/null || exit 0
          # only a finished render (mp4 present) has a voice that passed the number check
          git show "FETCH_HEAD:$NAME.mp4" >/dev/null 2>&1 && git show FETCH_HEAD:voice.wav >/dev/null 2>&1 || exit 0
          # older render branches have no tts.txt: their voice matches the current text (9-10 Nov), so reuse them too
          if git show FETCH_HEAD:tts.txt > /tmp/old_tts.txt 2>/dev/null && ! cmp -s /tmp/old_tts.txt "studio/public/$NAME/tts.txt"; then echo "text changed, new voice"; exit 0; fi
          git show FETCH_HEAD:voice.wav > "studio/public/$NAME/voice.wav"
          git show FETCH_HEAD:timeline.json > "studio/public/$NAME/timeline.json"
          echo "reuse=1" >> "$GITHUB_OUTPUT"; echo "reusing voice and timing from render-$NAME"

      - name: Voice (Gemini, Orus)
        if: steps.reuse.outputs.reuse != '1'
        run: python pipeline/tts.py "$NAME"

      - name: Timing and number check (Whisper)
        if: steps.reuse.outputs.reuse != '1'
        env:
          NUMCHECK_STRICT: "1"
          KEEP_PAUSES: "0.2"
          ALIGN_MODEL: small
        # Whisper small sometimes loops on a window and loses words (10 Nov), so a failed check gets one more listen with medium.
        run: |
          python pipeline/align.py "$NAME" 1.0 || { echo "::warning::check failed with whisper small, listening again with medium"; ALIGN_MODEL=medium python pipeline/align.py "$NAME" 1.0; }

      - name: Render
        working-directory: studio
        run: |
          if [ "${{ steps.nodecache.outputs.cache-hit }}" != "true" ]; then npm ci --no-audit --no-fund; fi
          npx remotion browser ensure
          npx remotion render src/index.ts Trend "../out/$NAME.mp4" --props="{\"dir\":\"$NAME\"}" --log=warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            out/${{ matrix.name }}.mp4
            studio/public/${{ matrix.name }}/timeline.json
            studio/public/${{ matrix.name }}/review.json

      - name: Publish render to branch render-<name>
        if: success()
        continue-on-error: true
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          for f in "out/$NAME.mp4" "studio/public/$NAME/timeline.json" "studio/public/$NAME/review.json" "studio/public/$NAME/voice.wav" "studio/public/$NAME/tts.txt"; do cp "$f" /tmp/pub/ 2>/dev/null || true; done
          cp studio/public/broll/*.jpg /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add . && git commit -qm "Render of $NAME" && git push -qf origin "HEAD:refs/heads/render-$NAME"
