# Analysis step: snapshot Doubt Clear view counts (free YouTube Data API) into analysis/snapshots.csv + analysis/scorecard.md.
# Runs every hour (schedules only fire from the default branch), on push of analysis/videos.csv or analysis/run.txt, or by hand.
# Secret: YOUTUBE_API_KEY, else GOOGLE_API_KEY / GEMINI_API_KEY with "YouTube Data API v3" enabled on its project. Writes only inside analysis/.
name: Video stats

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["claude/**", "main"]
    paths: ["analysis/videos.csv", "analysis/run.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref_name }}

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Snapshot stats
        run: |
          pip install -q requests
          python pipeline/stats.py
      - name: Save to the branch
        run: |
          git config user.name "stats-bot" && git config user.email "stats-bot@users.noreply.github.com"
          git add analysis
          git diff --cached --quiet && exit 0
          git commit -qm "Stats snapshot"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
